spring.application.name=demo

# trace debug info warning error --> these are different logging levels
logging.level.org.springframework = debug

# below is linked to concept of profiles --> eg. prod, UAT, Dev
spring.profiles.active = prod

# below is linked to concept of config props -->
curr-svc.url = http://default.com
curr-svc.username = yash
curr-svc.key = pswd

# below is linked to concept of actuator --> http://localhost:8080/actuator
#management.endpoints.web.exposure.include = *
management.endpoints.web.exposure.include = health, metrics

#below is linked to remove CORS error --> we add below annotation to a java class file
# @CrossOrigin(origins = "http://localhost:localhost")

# for TodoModel -> we do 4 operations --> fetch all, delete by Id, create new, updating

# H2 database -> 
spring.h2.console.enabled = true
spring.datasource.url = jdbc:h2:mem:testdb
spring.jpa.show-sql = true

# need to add below line so as to first create table todo_model and then only run data.sql to insert data in this table
spring.jpa.defer-datasource-initialization=true

